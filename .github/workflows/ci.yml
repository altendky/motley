name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  mise:
    name: Mise lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
        with:
          version: 2026.11.12
          install_args: --locked --dry-run
          cache: false

  pre-commit:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
        with:
          version: 2026.11.12
          install_args: --locked
          cache: true
          cache_key: "{{default}}-motley-recipe-${{ hashFiles('scripts/install-kicad-mcp*', 'scripts/kicad-mcp-*', 'scripts/kicad-launcher.sh', '.mise/locks/**') }}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml', 'mise.lock', '.mise/locks/**') }}
      - name: Check KiCad MCP startup without a desktop
        run: node scripts/check_kicad_mcp.mjs
      - name: Check board SVG freshness without modifying files
        run: uv run scripts/board_images.py --check
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          # CI verifies committed derivatives; local pre-commit regenerates them.
          SKIP: board-images

  requirements-report:
    name: Requirements report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
        with:
          version: 2026.11.12
          install_args: --locked
          cache: true
          cache_save: false
          cache_key: "{{default}}-motley-recipe-${{ hashFiles('scripts/install-kicad-mcp*', 'scripts/kicad-mcp-*', 'scripts/kicad-launcher.sh', '.mise/locks/**') }}"
      - name: Generate requirements Markdown
        env:
          REPORT_DIR: ${{ runner.temp }}/motley-requirements
        run: |
          mkdir -p "$REPORT_DIR"
          rqml validate requirements.rqml
          rqml overview requirements.rqml > "$REPORT_DIR/requirements.md"
          test -s "$REPORT_DIR/requirements.md"
      - name: Retain requirements report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements-${{ github.sha }}-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/motley-requirements/requirements.md
          if-no-files-found: error

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free firmware runner disk space
        run: |
          df -h /
          # This job uses the container SDK, not these preinstalled host SDKs.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
        with:
          version: 2026.11.12
          install_args: --locked
          cache: true
          cache_save: false
          cache_key: "{{default}}-motley-recipe-${{ hashFiles('scripts/install-kicad-mcp*', 'scripts/kicad-mcp-*', 'scripts/kicad-launcher.sh', '.mise/locks/**') }}"
      - name: Pull pinned firmware SDK
        run: |
          sdk_image="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("firmware/toolchain.toml").read_text())["image"])')"
          /usr/bin/time -f 'SDK image pull: %e seconds' docker pull "$sdk_image"
          docker image inspect "$sdk_image" --format 'SDK image size: {{.Size}} bytes'
          df -h /
      - name: Restore component-manager downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/motley-cache/components
          key: idf-components-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/toolchain.toml', 'firmware/dependencies.lock', 'firmware/main/idf_component.yml') }}
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/motley-cache/ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/toolchain.toml') }}-${{ hashFiles('firmware/dependencies.lock', 'firmware/sdkconfig.defaults', 'firmware/main/idf_component.yml') }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/toolchain.toml') }}-${{ hashFiles('firmware/dependencies.lock', 'firmware/sdkconfig.defaults', 'firmware/main/idf_component.yml') }}-
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/toolchain.toml') }}-
      - id: build
        name: Build and verify firmware
        run: uv run scripts/firmware.py
        env:
          MOTLEY_BUILD_DIR: ${{ runner.temp }}/motley-firmware
          MOTLEY_CACHE_DIR: ${{ runner.temp }}/motley-cache
      - name: Retain verified firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/motley-firmware/bundle/
          if-no-files-found: error
      - name: Retain failed build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motley-failed-diagnostics-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/motley-firmware/build.log
            ${{ runner.temp }}/motley-firmware/dependencies.log
            ${{ runner.temp }}/motley-firmware/failure.json
            ${{ runner.temp }}/motley-firmware/log/
          if-no-files-found: warn

  all:
    name: all
    if: ${{ !cancelled() }}
    needs: [mise, pre-commit, requirements-report, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
