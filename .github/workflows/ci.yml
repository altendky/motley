name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  mise:
    name: Mise lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.11.4
          install_args: --locked --dry-run
          cache: false

  pre-commit:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.11.4
          install_args: --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml', 'mise.lock', '.mise/locks/**') }}
      - run: pre-commit run --all-files --show-diff-on-failure

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.11.4
          install_args: --locked
      - id: build
        run: pre-commit run --hook-stage manual firmware-build --all-files
        env:
          MOTLEY_BUILD_DIR: ${{ runner.temp }}/motley-firmware
      - name: Retain verified firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/motley-firmware/bundle/
          if-no-files-found: error
      - name: Retain failed build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motley-failed-diagnostics-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/motley-firmware/build.log
            ${{ runner.temp }}/motley-firmware/failure.json
            ${{ runner.temp }}/motley-firmware/log/
          if-no-files-found: warn

  all:
    name: all
    if: ${{ !cancelled() }}
    needs: [mise, pre-commit, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
