min_version = "2026.11.2"

[settings]
locked = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]
# Replay the npm dependency graphs recorded alongside mise.lock.
npm.package_manager = "aube"

[tools]
node = "26.13.1"
python = "3.14.10"
uv = "0.13.8"
"pipx:pre-commit" = "4.7.0"
# Exact-version exception for a reviewed security backport published without
# the newer major line's trusted-publisher evidence. Re-review before extending.
# Tarball matches upstream: https://github.com/NaturalIntelligence/fast-xml-parser/commit/49a12f10e9a44da765f045ca0c60e8d9e5be5aa0
"npm:@rqml/cli" = { version = "0.11.0", trust_policy_excludes = ["fast-xml-parser@4.5.7"] }
"npm:@rqml/mcp" = { version = "0.8.0", trust_policy_excludes = ["fast-xml-parser@4.5.7"] }

# Official full AppImage, extracted once so CLI/editor launches need no FUSE.
# KiCad currently publishes AppImages only for Linux x86-64.
[tools."http:kicad"]
version = "10.0.8"
os = ["linux/x64"]
url = "https://mirrors.mit.edu/kicad/appimage/stable/kicad-{{ version }}-x86_64.AppImage.tar"
checksum = "sha256:27e4b4baa85c2181be6b219c22667ce138c20c0148dd2e047ba84dbda480dbb4"
bin_path = "bin"
postinstall = '''
cd "$MISE_TOOL_INSTALL_PATH"
./kicad-"$MISE_TOOL_VERSION"-x86_64.AppImage --appimage-extract
mkdir -p bin
for tool in kicad kicad-cli eeschema pcbnew gerbview bitmap2component pcb_calculator pl_editor; do
  install -m 755 "$MISE_CONFIG_ROOT/scripts/kicad-launcher.sh" "bin/$tool"
done
'''

[tasks.rqml]
description = "Run the pinned RQML CLI"
run = "rqml"

# Build the reviewed upstream release inside mise's cached installation root.
# This bridge uses the Python/pcbnew ABI bundled with the pinned AppImage.
[tools."http:kicad-mcp"]
version = "2.9.0"
os = ["linux/x64"]
url = "https://codeload.github.com/mixelpixx/KiCAD-MCP-Server/tar.gz/refs/tags/v{{ version }}"
checksum = "sha256:43f813c8c73a34a06b10518f8bee1d5e57d4a5b4e534c110d3a93f34554aa735"
format = "tar.gz"
strip_components = 1
bin_path = "bin"
depends = ["node", "python", "uv", "http:kicad"]
postinstall = 'sh "$MISE_CONFIG_ROOT/scripts/install-kicad-mcp.sh"'
