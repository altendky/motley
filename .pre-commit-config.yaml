repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/Mergifyio/mergify-pre-commit
    rev: 1.1.0
    hooks:
      - id: validate-mergify-config

  - repo: local
    hooks:
      - id: rqml-validate
        name: validate RQML
        entry: mise exec -- rqml validate requirements.rqml
        language: system
        files: ^requirements\.rqml$
        pass_filenames: false

      - id: rqml-lint
        name: lint RQML
        entry: mise exec -- rqml lint requirements.rqml --strictness strict
        language: system
        files: ^requirements\.rqml$
        pass_filenames: false

      - id: rqml-check
        name: check RQML coverage and drift
        entry: mise exec -- rqml check requirements.rqml --strictness strict
        language: system
        always_run: true
        pass_filenames: false
