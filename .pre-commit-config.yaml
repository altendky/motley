repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/Mergifyio/mergify-pre-commit
    rev: 1.1.0
    hooks:
      - id: validate-mergify-config

  - repo: local
    hooks:
      - id: firmware-metadata-tests
        name: test firmware identity and artifact handling
        entry: uv run scripts/test_firmware.py
        language: system
        files: ^(scripts/|firmware/|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)
        pass_filenames: false

      - id: firmware-build
        name: build and verify minimal ESP32-C6 firmware
        entry: uv run scripts/firmware.py
        language: system
        stages: [manual]
        always_run: true
        pass_filenames: false

      - id: hardware-trace-tests
        name: test native hardware traceability checks
        entry: uv run scripts/test_hardware_trace.py
        language: system
        files: ^(scripts/(hardware_trace|test_hardware_trace)\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: hardware-trace
        name: check native hardware requirement annotations
        entry: uv run scripts/hardware_trace.py
        language: system
        files: ^(hardware/|requirements\.rqml$|scripts/(hardware_trace|test_hardware_trace)\.py|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: board-image-tests
        name: test generated board SVG checks
        entry: uv run scripts/test_board_images.py
        language: system
        files: ^(scripts/(board_images|test_board_images)\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: board-images
        name: check generated board SVG freshness
        entry: uv run scripts/board_images.py --check
        language: system
        # A deletion-only commit must still detect a missing derivative.
        always_run: true
        pass_filenames: false

      - id: rqml-validate
        name: validate RQML
        entry: mise exec -- rqml validate requirements.rqml
        language: system
        files: ^requirements\.rqml$
        pass_filenames: false

      - id: rqml-lint
        name: lint RQML
        entry: mise exec -- rqml lint requirements.rqml --strictness strict
        language: system
        files: ^requirements\.rqml$
        pass_filenames: false

      - id: rqml-check
        name: check RQML consistency and drift
        entry: mise exec -- rqml check requirements.rqml --strictness standard
        language: system
        always_run: true
        pass_filenames: false

      - id: rqml-gate
        name: check mapped implementation approval
        entry: mise exec -- rqml gate --spec requirements.rqml
        language: system
        always_run: true
        pass_filenames: false
